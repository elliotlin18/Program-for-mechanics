# Local Postgres for development. `docker compose up -d` then `npm run db:migrate`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trygg
      POSTGRES_PASSWORD: trygg
      POSTGRES_DB: trygg_ekonomi
    ports:
      - "5432:5432"
    volumes:
      - trygg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trygg -d trygg_ekonomi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trygg_pg:
